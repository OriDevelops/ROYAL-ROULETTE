<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Royal Roulette</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #c9a84c;
      --gold-l:  #f0d060;
      --bg:      #0d0d0d;
      --bg2:     #161616;
      --bg3:     #1e1e1e;
      --border:  #2e2e2e;
      --text:    #e8e8e8;
      --dim:     #888;
      --red:     #e74c3c;
      --green:   #2ecc71;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: var(--bg2);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 14px;
      padding: 36px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .login-box h1 { font-size: 22px; color: var(--gold); letter-spacing: 2px; }
    .login-box p  { font-size: 12px; color: var(--dim); }

    input[type="password"], input[type="number"], input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--gold); }
    input::placeholder { color: var(--dim); }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      padding: 9px 16px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover   { opacity: 0.85; }
    .btn:active  { transform: scale(0.97); }
    .btn-gold    { background: linear-gradient(135deg, #c9a84c, #8b6914); color: #fff; }
    .btn-green   { background: #1a7a3a; color: #fff; border: 1px solid var(--green); }
    .btn-red     { background: #7a1515; color: #fff; border: 1px solid var(--red); }
    .btn-blue    { background: #1a4a8a; color: #fff; border: 1px solid #3498db; }
    .btn-sm      { padding: 5px 10px; font-size: 12px; }
    .btn-full    { width: 100%; }

    /* ── Admin layout ── */
    #admin-screen { display: none; flex-direction: column; min-height: 100vh; }
    #admin-screen.active { display: flex; }

    header {
      background: var(--bg2);
      border-bottom: 1px solid rgba(201,168,76,0.2);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title { font-size: 18px; font-weight: 800; color: var(--gold); letter-spacing: 2px; }
    .header-sub   { font-size: 11px; color: var(--dim); margin-top: 2px; }

    main { padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      flex: 1;
      min-width: 140px;
      text-align: center;
    }

    .stat-chip .label { font-size: 10px; color: var(--dim); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .stat-chip .value { font-size: 24px; font-weight: 800; color: var(--gold-l); margin-top: 4px; }

    /* ── Table ── */
    .table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .table-header h2 { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: var(--bg);
      padding: 10px 14px;
      text-align: left;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--dim);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 11px 14px;
      font-size: 13px;
      vertical-align: middle;
    }

    .username-cell { font-weight: 700; color: var(--gold); }
    .balance-cell  { font-weight: 800; font-variant-numeric: tabular-nums; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    .actions-cell { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .add-funds-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .add-funds-row input { width: 80px; padding: 5px 8px; font-size: 12px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #toast.success { border-left: 3px solid var(--green); }
    #toast.error   { border-left: 3px solid var(--red); }

    /* ── Modal confirm ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }

    .modal-box {
      background: var(--bg2);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 14px;
      padding: 28px;
      width: 340px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-box h3   { font-size: 16px; color: var(--text); }
    .modal-box p    { font-size: 13px; color: var(--dim); }
    .modal-actions  { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; }

    .empty-state { padding: 40px; text-align: center; color: var(--dim); font-size: 14px; }
  </style>
</head>
<body>

<!-- Not admin message -->
<div id="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div style="text-align:center;color:#888;">
    <div style="font-size:48px;margin-bottom:16px;">🔒</div>
    <div style="font-size:16px;color:#e8e8e8;margin-bottom:8px;">Access Denied</div>
    <div style="font-size:13px;margin-bottom:20px;">Login as admin to access this panel</div>
    <a href="/" style="color:#c9a84c;font-size:13px;">← Back to Game</a>
  </div>
</div>

<!-- Admin panel -->
<div id="admin-screen">
  <header>
    <div>
      <div class="header-title">⚙ ADMIN PANEL</div>
      <div class="header-sub">Royal Roulette Casino</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn btn-gold btn-sm" id="refresh-btn">↻ Refresh</button>
      <button class="btn btn-sm" style="background:var(--bg3);border:1px solid var(--border);color:var(--dim);" id="logout-admin-btn">Logout</button>
    </div>
  </header>

  <main>
    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat-chip">
        <div class="label">Total Users</div>
        <div class="value" id="stat-users">0</div>
      </div>
      <div class="stat-chip">
        <div class="label">House P&L</div>
        <div class="value" id="stat-house">0</div>
      </div>
    </div>

    <!-- Users table -->
    <div class="table-wrap">
      <div class="table-header">
        <h2>Users</h2>
      </div>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Balance</th>
            <th>Spins</th>
            <th>Wins</th>
            <th>Money</th>
            <th>Net P/L</th>
            <th>Add Funds</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="8" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay hidden" id="delete-modal">
  <div class="modal-box">
    <h3>Delete User?</h3>
    <p id="delete-modal-name"></p>
    <div class="modal-actions">
      <button class="btn btn-sm" style="background:var(--bg3);border:1px solid var(--border);color:var(--dim);" id="delete-cancel">Cancel</button>
      <button class="btn btn-red btn-sm" id="delete-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  const ADMIN_KEY_STORE = 'admin_key';
  let adminKey = '';
  let pendingDeleteId = null;

  // ── Helpers ──────────────────────────────────────────
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = type;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  function fmt(n) {
    return Number(n).toLocaleString('en-US');
  }

  function getToken() {
    return localStorage.getItem('casino_token') || '';
  }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-Session-Token': getToken() },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error');
    return data;
  }

  // ── Auto-enter if already logged in as admin ──────────
  async function tryAutoLogin() {
    if (!getToken()) return;
    try {
      await api('GET', '/admin/api/users');
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').classList.add('active');
      loadUsers();
    } catch (_) {}
  }
  tryAutoLogin();

  // ── Load users ────────────────────────────────────────
  async function loadUsers() {
    const data = await api('GET', '/admin/api/users');
    const users = data.users.sort((a, b) => b.balance - a.balance);

    // Stats bar
    const housePL = -users.reduce((s, u) => s + (u.netPL || 0), 0);

    document.getElementById('stat-users').textContent = users.length;
    const houseEl = document.getElementById('stat-house');
    houseEl.textContent = (housePL >= 0 ? '+' : '') + fmt(housePL);
    houseEl.style.color = housePL >= 0 ? 'var(--green)' : 'var(--red)';

    // Table
    const tbody = document.getElementById('users-tbody');
    if (users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No users yet</td></tr>';
      return;
    }

    tbody.innerHTML = users.map((u, i) => {
      const pl      = u.netPL;
      const plClass = pl > 0 ? 'pos' : pl < 0 ? 'neg' : '';
      const plText  = (pl >= 0 ? '+' : '') + fmt(pl);
      const medal   = i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : '';

      return `<tr data-id="${u.id}">
        <td class="username-cell">${medal}${escHtml(u.username)}</td>
        <td class="balance-cell">${fmt(u.balance)} CR</td>
        <td>${fmt(u.spins)}</td>
        <td>${fmt(u.wins)}</td>
        <td>${fmt(u.balance)} CR</td>
        <td class="${plClass}">${plText}</td>
        <td>
          <div class="add-funds-row">
            <input type="number" min="1" max="1000000" placeholder="Amount" id="funds-${u.id}">
            <button class="btn btn-green btn-sm" onclick="addFunds('${u.id}')">Add</button>
          </div>
        </td>
        <td class="actions-cell">
          <button class="btn btn-blue btn-sm" onclick="loginAs('${u.id}', '${escHtml(u.username)}')">Login As</button>
          <button class="btn btn-red btn-sm"  onclick="confirmDelete('${u.id}', '${escHtml(u.username)}')">Delete</button>
        </td>
      </tr>`;
    }).join('');
  }

  // ── Add funds ─────────────────────────────────────────
  async function addFunds(userId) {
    const input  = document.getElementById(`funds-${userId}`);
    const amount = parseInt(input.value);
    if (!amount || amount < 1) return toast('Enter a valid amount', 'error');
    try {
      const data = await api('POST', `/admin/api/users/${userId}/add-funds`, { amount });
      toast(`✓ Added ${fmt(amount)} CR — new balance: ${fmt(data.balance)} CR`);
      input.value = '';
      loadUsers();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  // ── Login as ──────────────────────────────────────────
  async function loginAs(userId, username) {
    try {
      const data = await api('POST', `/admin/api/users/${userId}/login-as`);
      localStorage.setItem('casino_token', data.token);
      toast(`✓ Logged in as ${username} — redirecting…`);
      setTimeout(() => window.location.href = '/', 1200);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  // ── Delete ────────────────────────────────────────────
  function confirmDelete(userId, username) {
    pendingDeleteId = userId;
    document.getElementById('delete-modal-name').textContent = `Are you sure you want to delete "${username}"? This cannot be undone.`;
    document.getElementById('delete-modal').classList.remove('hidden');
  }

  document.getElementById('delete-cancel').addEventListener('click', () => {
    document.getElementById('delete-modal').classList.add('hidden');
    pendingDeleteId = null;
  });

  document.getElementById('delete-confirm').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    try {
      await api('DELETE', `/admin/api/users/${pendingDeleteId}`);
      document.getElementById('delete-modal').classList.add('hidden');
      pendingDeleteId = null;
      toast('✓ User deleted');
      loadUsers();
    } catch (e) {
      toast(e.message, 'error');
    }
  });

  // ── Other ──────────────────────────────────────────────
  document.getElementById('refresh-btn').addEventListener('click', loadUsers);
  document.getElementById('logout-admin-btn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST', headers: { 'X-Session-Token': getToken() } }).catch(() => {});
    localStorage.removeItem('casino_token');
    window.location.href = '/';
  });

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>

</body>
</html>
